<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waiting for Approval</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #050811; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .wait-card { background: #0f172a; border: 1px solid #1f293d; border-radius: 20px; padding: 40px; text-align: center; max-width: 450px; }
    </style>
    <script>
        setInterval(function() {
            fetch('/check-approval-status')
                .then(response => response.text())
                .then(status => {
                    if (status.trim() === "APPROVED") {
                        window.location.href = "/user-dashboard";
                    }
                });
        }, 3000);
    </script>
</head>
<body>
    <div class="wait-card">
        <div class="spinner-border text-info mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <h4 class="fw-bold mb-2">Approval Pending</h4>
        <p class="text-muted small">Your login request for <strong class="text-white">{{ phone }}</strong> has been sent to Administrator <strong>Bijoosh Padmakumar</strong>.</p>
        <p class="text-warning small mt-3">Please keep this window open. Once the admin approves your account, you will be logged in automatically instantly!</p>
    </div>
</body>
</html>
