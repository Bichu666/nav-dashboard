<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - NAV Updates</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        html, body {
            height: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
        }
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            background: #111827;
            border: 1px solid #374151;
            padding: 36px 28px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin: auto;
        }
        .login-card h2 {
            color: #ffb74d;
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            color: #9ca3af;
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
        }
        .login-input {
            width: 100%;
            padding: 12px 14px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .login-input:focus {
            border-color: #ffb74d;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            background: #ffb74d;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: filter 0.2s;
        }
        .btn-submit:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Admin Login</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div style="background: #ef4444; color: white; padding: 10px; margin-bottom: 16px; border-radius: 6px; font-size: 13px; text-align: center;">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" name="mobile" placeholder="+918078535666" class="login-input" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" class="login-input" required>
                </div>
                <button type="submit" class="btn-submit">Login to Portal</button>
            </form>
        </div>
    </div>
</body>
</html>
