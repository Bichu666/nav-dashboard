<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pending Approval - NAV Updates</title>
    <!-- Auto-refresh every 10 seconds to check if admin approved -->
    <meta http-equiv="refresh" content="10">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .waiting-card {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            width: 450px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .waiting-card h2 {
            color: #ff9800;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .waiting-card p {
            color: #ccc;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .spinner {
            margin: 15px auto;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top: 3px solid #ff9800;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-back {
            display: inline-block;
            background: #ffb74d;
            color: #121212;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="waiting-card">
        <h2>Approval Pending</h2>
        <div class="spinner"></div>
        <p>Hello <b>{{ username | default('User') }}</b>,<br><br>Your account is awaiting administrator approval. This page will <b>automatically open</b> your dashboard as soon as the admin approves your request.</p>
        <a href="{{ url_for('login') }}" class="btn-back">Back to Login</a>
    </div>
</body>
</html>
