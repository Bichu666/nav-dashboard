<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waiting for Approval - NAV Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta http-equiv="refresh" content="5"> <!-- Auto refreshes every 5 seconds until approved -->
    <style>
        body { background: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .card { border-radius: 20px; padding: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 600px; }
    </style>
</head>
<body>
    <div class="card bg-white">
        <div class="spinner-border text-primary mb-4" style="width: 4rem; height: 4rem;" role="status"></div>
        <h2 class="fw-bold text-dark mb-3">Approval Pending</h2>
        <p class="text-muted fs-5 mb-4">Hello <strong>{{ user }}</strong>, an approval request has been sent to Admin <strong>BIJOOSH PADMAKUMAR</strong>. Once approved, this page will automatically log you in.</p>
        <div class="alert alert-info fs-6">⏳ Auto-checking your approval status every few seconds... Do not close this page.</div>
        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary mt-3">Back to Login</a>
    </div>
</body>
</html>
