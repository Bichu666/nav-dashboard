<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Pending - NAV Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .card { 
            background: white; 
            padding: 35px 28px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            width: 100%;
            max-width: 420px; 
            text-align: center; 
        }
        h2 { color: #d9534f; margin-top: 0; margin-bottom: 12px; font-size: 24px; }
        p { color: #555; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        a { 
            display: inline-block;
            padding: 12px 20px; 
            font-size: 15px; 
            font-weight: 600; 
            color: #007bff; 
            text-decoration: none; 
            border-radius: 8px; 
            transition: background-color 0.2s;
        }
        a:hover { background-color: #f1f3f5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Access Pending</h2>
        <p>Your mobile number is not yet approved by the administrator, or your request is pending review.</p>
        <p>Please contact the admin to grant access to your account.</p>
        <a href="{{ url_for('index') }}">Back to Login</a>
    </div>
</body>
</html>
