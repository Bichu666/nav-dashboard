<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NAV Dashboard Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #25D366; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1ebe5d; }
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>NAV Dashboard</h2>
        <p>Enter your phone number to request WhatsApp approval</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="phone" placeholder="+918078535666" required>
            <button type="submit">Request WhatsApp Approval</button>
        </form>
    </div>
</body>
</html>
