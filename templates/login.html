<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV Update - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4 fw-bold">NAV UPDATE LOGIN</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} small py-2">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small">Username</label>
                <input type="text" name="username" class="form-control" value="+918078535666" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small">Mobile Number</label>
                <input type="text" name="mobile" class="form-control" value="+918078535666" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small">Password</label>
                <input type="password" name="password" class="form-control" value="Bichu@5419" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Login</button>
        </form>
        <div class="mt-3 text-center">
            <small class="text-muted">Admin Login: <strong>+918078535666</strong> / <strong>Bichu@5419</strong></small>
        </div>
    </div>
</body>
</html>
