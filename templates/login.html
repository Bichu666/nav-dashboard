<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NAV Dashboard</title>
    <!-- Correct Flask static file linking -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-3">Welcome</h3>
        <p class="text-center text-muted mb-4">Enter your mobile number to continue</p>
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="mobile" class="form-control" placeholder="Mobile Number" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Request Approval</button>
        </form>
    </div>
</body>
</html>
