<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - NAV Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <div class="card" style="text-align: center;">
            <h2>Welcome</h2>
            <p style="margin-bottom: 20px; color: #666;">Enter your credentials to continue</p>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div style="margin-bottom: 15px;">
                    <input type="text" name="mobile" placeholder="Mobile Number (+91...)" required style="width: 100%; padding: 10px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 10px;">
                </div>
                <button type="submit" class="btn-upload" style="width: 100%; padding: 10px;">Login / Request Access</button>
            </form>
        </div>
    </div>
</body>
</html>
