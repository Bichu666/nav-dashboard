<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Portal - NAV Updates</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-panel: #111827;
            --bg-card: #1f2937;
            --border-color: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-gold: #fbbf24;
            --accent-orange: #f59e0b;
            --green: #00FF00; /* Electric Green matched from Admin Dashboard */
            --red: #FF0800;   /* Candy Apple Red matched from Admin Dashboard */
        }

        body { 
            font-size: 16px !important; 
            background-color: var(--bg-main) !important;
            color: var(--text-main) !important;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        .dashboard-container { 
            max-width: 1440px; 
            margin: 0 auto; 
            padding: 24px; 
        }
        
        .main-header {
            background: linear-gradient(135deg, var(--bg-panel) 0%, var(--bg-card) 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .main-header h2 { 
            font-size: 22px !important; 
            margin: 0 0 4px 0;
            background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-header h1 { 
            font-size: 34px !important; 
            margin: 0;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ff8c00 0%, #f59e0b 50%, #fcd34d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 12px rgba(245, 158, 11, 0.2);
        }

        .control-center-text { font-size: 14px !important; }
        .panel h3 { 
            font-size: 17px !important; 
            margin-top: 0;
            margin-bottom: 15px; 
            color: var(--accent-gold); 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 8px; 
        }
        
        .sensex-main-val { font-size: 30px !important; font-weight: 700; color: #fff; margin-top: 8px; }
        .sensex-change-val { font-size: 16px !important; font-weight: 600; margin-top: 4px; }
        
        .fund-table-full th, .fund-table-full td { font-size: 14px !important; padding: 14px 12px !important; }
