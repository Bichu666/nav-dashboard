<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal - NAV Dashboard</title>
    <!-- Add your original stylesheets/links here if any -->
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 {
            color: #f0f6fc;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #161b22;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }
        th {
            background-color: #21262d;
            color: #8b949e;
        }
        tr:hover {
            background-color: #1f6feb15;
        }
        .fund-link {
            color: #58a6ff;
            cursor: pointer;
            text-decoration: underline;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #111827;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            color: #fff;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .close-btn {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #9ca3af;
        }
        .close-btn:hover {
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Equity (Click any fund for full performance details)</h2>
    
    <table>
        <thead>
            <tr>
                <th>FUNDS</th>
                <th>Inception Date</th>
                <th>Benchmark Name</th>
                <th>Since Inception</th>
                <th>Highest NAV</th>
                <th>Latest NAV</th>
            </tr>
        </thead>
        <tbody>
            <!-- Example row format with data attributes to power the modal -->
            <tr class="fund-row" 
                data-fund-name="Maximiser Fund" 
                data-inception="November 19, 2001" 
                data-benchmark="S&amp;P BSE 100"
                data-since-inception="14.64%"
                data-y1="1.66%"
                data-y3="8.72%"
                data-y5="8.35%"
                data-y10="9.58%"
                data-high-nav="313.3828"
                data-latest-nav="276.343">
                <td class="fund-link">Maximiser Fund</td>
                <td>November 19, 2001</td>
                <td>S&amp;P BSE 100</td>
                <td style="color: #00FF00;">14.64%</td>
                <td>313.3828</td>
                <td style="color: #00FF00;">276.343</td>
            </tr>
            <tr class="fund-row" 
                data-fund-name="Maximiser Fund II" 
                data-inception="May 20, 2004" 
                data-benchmark="S&amp;P BSE 100"
                data-since-inception="14.14%"
                data-y1="1.42%"
                data-y3="8.12%"
                data-y5="7.95%"
                data-y10="9.12%"
                data-high-nav="200.6271"
                data-latest-nav="178.3121">
                <td class="fund-link">Maximiser Fund II</td>
                <td>May 20, 2004</td>
                <td>S&amp;P BSE 100</td>
                <td style="color: #00FF00;">14.14%</td>
                <td>200.6271</td>
                <td style="color: #00FF00;">178.3121</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Fund Performance Modal -->
<div id="fundModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeFundModal()">&times;</span>
        <h3 id="modalFundTitle" style="margin-top:0; color:#f59e0b;">Fund Performance</h3>
        <p style="font-size:13px; color:#9ca3af;"><span id="modalInceptionDate"></span> | <span id="modalBenchmark"></span></p>
        <div id="modalTableContainer" style="max-height:400px; overflow-y:auto; margin-top:15px;">
            <!-- Metrics populate dynamically -->
        </div>
    </div>
</div>

<script>
    // 1. 5-Minute Auto-Refresh (300,000 milliseconds)
    setTimeout(function() {
        location.reload();
    }, 300000);

    // 2. Click Handler for Funds Modal Popup
    document.querySelectorAll('.fund-row, .fund-link').forEach(item => {
        item.style.cursor = 'pointer';
        item.addEventListener('click', function() {
            const row = this.closest('tr');
            if (!row) return;
            
            const fundName = row.dataset.fundName;
            const inceptionDate = row.dataset.inception;
            const benchmark = row.dataset.benchmark;
            
            document.getElementById('modalFundTitle').innerText = fundName;
            document.getElementById('modalInceptionDate').innerText = "Inception Date: " + inceptionDate;
            document.getElementById('modalBenchmark').innerText = "Benchmark Name: " + benchmark;
            
            const container = document.getElementById('modalTableContainer');
            container.innerHTML = `
                <table style="width:100%; border-collapse:collapse; text-align:left; font-size:14px;">
                    <tr style="border-bottom:1px solid #374151; color:#9ca3af;"><th style="padding:8px;">Metric / Period</th><th style="padding:8px;">Value / Return</th></tr>
                    <tr style="border-bottom:1px solid #1f2937;"><td style="padding:8px;">Since Inception</td><td style="padding:8px; color:${getColor(row.dataset.sinceInception)};">${row.dataset.sinceInception}</td></tr>
                    <tr style="border-bottom:1px solid #1f2937;"><td style="padding:8px;">1 Year</td><td style="padding:8px; color:${getColor(row.dataset.y1)};">${row.dataset.y1}</td></tr>
                    <tr style="border-bottom:1px solid #1f2937;"><td style="padding:8px;">3 Year</td><td style="padding:8px; color:${getColor(row.dataset.y3)};">${row.dataset.y3}</td></tr>
                    <tr style="border-bottom:1px solid #1f2937;"><td style="padding:8px;">5 Year</td><td style="padding:8px; color:${getColor(row.dataset.y5)};">${row.dataset.y5}</td></tr>
                    <tr style="border-bottom:1px solid #1f2937;"><td style="padding:8px;">10 Year</td><td style="padding:8px; color:${getColor(row.dataset.y10)};">${row.dataset.y10}</td></tr>
                    <tr style="border-bottom:1px solid #1f2937;"><td style="padding:8px;">Highest NAV</td><td style="padding:8px;">${row.dataset.highNav}</td></tr>
                    <tr><td style="padding:8px;">Latest NAV</td><td style="padding:8px; color:${Number(row.dataset.latestNav) >= 10 ? '#00FF00' : '#FF0800'};">${row.dataset.latestNav}</td></tr>
                </table>
            `;
            
            document.getElementById('fundModal').style.display = 'flex';
        });
    });

    function closeFundModal() {
        document.getElementById('fundModal').style.display = 'none';
    }

    // Color helpers adhering strictly to Electric Green (#00FF00) and Candy Apple Red (#FF0800)
    function getColor(val) {
        const num = parseFloat(val);
        if (isNaN(num)) return '#fff';
        return num > 0 ? '#00FF00' : '#FF0800';
    }

    // Close modal when clicking outside the window box
    window.onclick = function(event) {
        const modal = document.getElementById('fundModal');
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    }
</script>

</body>
</html>
