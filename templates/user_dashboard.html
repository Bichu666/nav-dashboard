<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal - NAV Updates</title>
    <!-- Include Google Cursive Font -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <!-- Include Bootstrap or your main CSS styling here -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-color: #121620; color: #ffffff;">

    <div class="container-fluid py-4">
        
        <!-- Header Title / Festive Section -->
        <div class="text-center my-3">
            {% if festival_greeting %}
                <!-- Colorful, glowing festive greeting taking full stage, replacing NAV UPDATES -->
                <div style="font-family: 'Great Vibes', cursive; font-size: 3.8rem; background: linear-gradient(45deg, #ffd700, #ff8c00, #ff4500, #ff1493, #00ffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 25px rgba(255, 215, 0, 0.6), 0 0 50px rgba(255, 69, 0, 0.4); letter-spacing: 3px; font-weight: bold; padding: 5px 0;">
                    ✨ {{ festival_greeting }} ✨
                </div>
            {% else %}
                <!-- Standard title shown on normal days -->
                <h2 style="color: #ffc107; font-weight: bold; letter-spacing: 1px;">NAV UPDATES</h2>
            {% endif %}
        </div>

        <!-- Rest of your dashboard content follows here... -->

    </div>

</body>
</html>
